<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little World ♡</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        linear-gradient(135deg, #fff7f8, #fce9ee, #f8e2e9);
      background-size: 45px 45px, cover;
      color: #654953;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      color: rgba(194, 113, 137, .35);
      font-size: 20px;
      animation: float 8s linear infinite;
    }

    .heart:nth-child(1) { left: 8%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 25%; animation-delay: 2s; }
    .heart:nth-child(3) { left: 47%; animation-delay: 4s; }
    .heart:nth-child(4) { left: 68%; animation-delay: 1s; }
    .heart:nth-child(5) { left: 88%; animation-delay: 3s; }

    @keyframes float {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 1; }
      to {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1100px, 92%);
      margin: auto;
      padding: 45px 0 70px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .small-title {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ad7184;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "DM Serif Display", serif;
      font-size: clamp(45px, 8vw, 78px);
      font-weight: 400;
      color: #754d5c;
      line-height: 1;
    }

    .subtitle {
      margin-top: 15px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 18px;
      color: #9b6d7b;
    }

    .booth {
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(167, 106, 127, .22);
      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(112, 72, 85, .12);
      backdrop-filter: blur(12px);
    }

    .camera-area {
      position: relative;
      background: #ead6dc;
      border-radius: 22px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 7px solid #fff;
      box-shadow: inset 0 0 0 1px #d8b5c0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scaleX(-1);
    }

    #preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      background: #f4e4e8;
    }

    .camera-placeholder {
      text-align: center;
      padding: 30px;
    }

    .camera-placeholder .camera-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .camera-placeholder h2 {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 400;
      color: #765362;
    }

    .camera-placeholder p {
      font-size: 13px;
      margin-top: 8px;
      color: #a17886;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
      transition: .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: #9d6074;
      color: white;
      padding: 13px 24px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(157, 96, 116, .2);
    }

    .secondary {
      background: #fff;
      color: #8b596b;
      padding: 13px 24px;
      border-radius: 999px;
      border: 1px solid #e3c5cd;
    }

    .settings {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .setting {
      background: rgba(255,255,255,.72);
      border: 1px solid #ead3d9;
      padding: 15px;
      border-radius: 18px;
    }

    .setting label {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #a07381;
    }

    select {
      width: 100%;
      border: none;
      outline: none;
      background: #f9eef1;
      padding: 10px;
      border-radius: 10px;
      color: #654953;
      font-family: "Poppins", sans-serif;
    }

    .gallery-title {
      text-align: center;
      margin: 50px 0 20px;
    }

    .gallery-title h2 {
      font-family: "DM Serif Display", serif;
      font-weight: 400;
      font-size: 35px;
      color: #754d5c;
    }

    .gallery-title p {
      font-size: 13px;
      color: #a17886;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .photo-card {
      background: white;
      padding: 10px 10px 16px;
      border-radius: 5px;
      box-shadow: 0 8px 25px rgba(112, 72, 85, .12);
      transform: rotate(-1deg);
    }

    .photo-card:nth-child(even) {
      transform: rotate(1.5deg);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f5e5e9;
    }

    .photo-card p {
      text-align: center;
      margin-top: 10px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      color: #8d6572;
    }

    footer {
      text-align: center;
      margin-top: 55px;
      color: #a17886;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .countdown {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: "DM Serif Display", serif;
      font-size: 100px;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,.25);
      background: rgba(100,70,80,.12);
      z-index: 5;
    }

    @media (max-width: 600px) {
      .page {
        padding-top: 30px;
      }

      .booth {
        padding: 14px;
      }

      .camera-area {
        aspect-ratio: 4 / 5;
      }

      .controls button {
        width: 100%;
      }
    }
  </style></head><body>  <div class="hearts">
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
  </div>  <main class="page"><header>
  <div class="small-title">a little place for us</div>
  <h1>Our Photobooth ♡</h1>
  <p class="subtitle">saving tiny moments that feel like forever</p>
</header>

<section class="booth">

  <div class="camera-area">

    <div class="camera-placeholder" id="placeholder">
      <div class="camera-icon">📷</div>
      <h2>Ready for a picture?</h2>
      <p>Turn on your camera and make a little memory ♡</p>
    </div>

    <video id="camera" autoplay playsinline></video>
    <img id="preview" alt="Your photo">

    <div class="countdown" id="countdown">3</div>

  </div>

  <div class="controls">
    <button class="primary" id="startBtn">
      ♡ Start Camera
    </button>

    <button class="primary" id="captureBtn" style="display:none;">
      📸 Take Photo
    </button>

    <button class="secondary" id="retakeBtn" style="display:none;">
      ↻ Retake
    </button>

    <button class="secondary" id="downloadBtn" style="display:none;">
      ♡ Save Photo
    </button>
  </div>

  <div class="settings">

    <div class="setting">
      <label>Photo Style</label>
      <select id="filter">
        <option value="normal">Original</option>
        <option value="vintage">Vintage</option>
        <option value="soft">Soft Dream</option>
        <option value="pink">Pink Romance</option>
        <option value="bw">Black & White</option>
      </select>
    </div>

    <div class="setting">
      <label>Timer</label>
      <select id="timer">
        <option value="3">3 seconds</option>
        <option value="5">5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </div>

  </div>

</section>

<section class="gallery-title">
  <h2>Little Memories</h2>
  <p>photos taken in our tiny corner of the internet ♡</p>
</section>

<section class="gallery" id="gallery"></section>

<footer>
  made with love ♡ just for the two of us
</footer>

  </main>  <script>
    const camera = document.getElementById("camera");
    const preview = document.getElementById("preview");
    const placeholder = document.getElementById("placeholder");

    const startBtn = document.getElementById("startBtn");
    const captureBtn = document.getElementById("captureBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    const countdown = document.getElementById("countdown");
    const timerSelect = document.getElementById("timer");
    const filterSelect = document.getElementById("filter");
    const gallery = document.getElementById("gallery");

    let stream = null;
    let currentPhoto = null;

    startBtn.addEventListener("click", async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        camera.srcObject = stream;

        placeholder.style.display = "none";
        preview.style.display = "none";
        camera.style.display = "block";

        startBtn.style.display = "none";
        captureBtn.style.display = "inline-block";
      } catch (error) {
        alert("Please allow camera access so the photobooth can work ♡");
      }
    });

    captureBtn.addEventListener("click", async () => {
      let seconds = Number(timerSelect.value);

      countdown.style.display = "flex";

      for (let i = seconds; i > 0; i--) {
        countdown.textContent = i;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }

      countdown.textContent = "♡";
      await new Promise(resolve => setTimeout(resolve, 300));

      countdown.style.display = "none";

      takePhoto();
    });

    function takePhoto() {
      const canvas = document.createElement("canvas");

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;

      const ctx = canvas.getContext("2d");

      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
      );

      applyFilter(ctx, canvas.width, canvas.height);

      currentPhoto = canvas.toDataURL("image/jpeg", 0.95);

      preview.src = currentPhoto;

      camera.style.display = "none";
      preview.style.display = "block";

      captureBtn.style.display = "none";
      retakeBtn.style.display = "inline-block";
      downloadBtn.style.display = "inline-block";

      addToGallery(currentPhoto);
    }

    function applyFilter(ctx, width, height) {
      const filter = filterSelect.value;

      if (filter === "vintage") {
        ctx.fillStyle = "rgba(170, 115, 70, .20)";
        ctx.fillRect(0, 0, width, height);

        ctx.globalAlpha = .12;
        ctx.fillStyle = "#fff3d6";
        ctx.fillRect(0, 0, width, height);

        ctx.globalAlpha = 1;
      }

      if (filter === "soft") {
        ctx.fillStyle = "rgba(255, 210, 225, .18)";
        ctx.fillRect(0, 0, width, height);
      }

      if (filter === "pink") {
        ctx.fillStyle = "rgba(255, 130, 165, .20)";
        ctx.fillRect(0, 0, width, height);
      }

      if (filter === "bw") {
        const image = ctx.getImageData(0, 0, width, height);
        const data = image.data;

        for (let i = 0; i < data.length; i += 4) {
          const average =
            (data[i] + data[i + 1] + data[i + 2]) / 3;

          data[i] = average;
          data[i + 1] = average;
          data[i + 2] = average;
        }

        ctx.putImageData(image, 0, 0);
      }
    }

    retakeBtn.addEventListener("click", () => {
      preview.style.display = "none";
      camera.style.display = "block";

      retakeBtn.style.display = "none";
      downloadBtn.style.display = "none";
      captureBtn.style.display = "inline-block";
    });

    downloadBtn.addEventListener("click", () => {
      if (!currentPhoto) return;

      const link = document.createElement("a");

      link.download = "our-little-memory.jpg";
      link.href = currentPhoto;

      link.click();
    });

    function addToGallery(photo) {
      const card = document.createElement("div");

      card.className = "photo-card";

      const image = document.createElement("img");
      image.src = photo;

      const caption = document.createElement("p");
      caption.textContent = "a little memory ♡";

      card.appendChild(image);
      card.appendChild(caption);

      gallery.prepend(card);
    }
  </script></body>
</html>
